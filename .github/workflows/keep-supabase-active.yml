name: Keep Supabase Active

on:
  schedule:
    # Run daily at 3 AM UTC. Supabase pauses free projects after 7 days
    # without activity, and GitHub often delays or skips scheduled runs.
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Auth Supabase Database
        run: |
          curl -fsS -X POST '${{ secrets.AUTH_SUPABASE_URL }}/rest/v1/rpc/ping' \
            -H "apikey: ${{ secrets.AUTH_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
